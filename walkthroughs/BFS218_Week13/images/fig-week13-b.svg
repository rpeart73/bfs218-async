<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Build one bounded claim</title>
  <desc id="desc">Case, mechanism, evidence, and boundary pieces assemble around one defensible claim.</desc>
  <defs><radialGradient id="bg" cx="50%" cy="45%"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9eef3"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b2a4a" flood-opacity=".17"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="92" text-anchor="middle" fill="#961a13" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">CLAIM ASSEMBLY</text>
  <text x="800" y="157" text-anchor="middle" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="800">Four pieces make the claim trustworthy</text>
  <g fill="none" stroke="#8ea0b3" stroke-width="5" stroke-dasharray="11 12"><path d="M450 350 645 420"/><path d="M1150 350 955 420"/><path d="M450 675 645 540"/><path d="M1150 675 955 540"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(120 245)"><rect width="350" height="205" rx="24" fill="#fff" stroke="#1b2a4a" stroke-width="3"/><circle cx="55" cy="55" r="26" fill="#1b2a4a"/><text x="55" y="64" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">1</text><text x="98" y="62" fill="#17243b" font-size="29" font-weight="800">CASE</text><text x="34" y="120" fill="#4b5666" font-size="23">Name the specific system,</text><text x="34" y="154" fill="#4b5666" font-size="23">institution, and setting</text></g>
    <g transform="translate(1130 245)"><rect width="350" height="205" rx="24" fill="#fff" stroke="#00aeb3" stroke-width="3"/><circle cx="55" cy="55" r="26" fill="#008b90"/><text x="55" y="64" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">2</text><text x="98" y="62" fill="#17243b" font-size="29" font-weight="800">MECHANISM</text><text x="34" y="120" fill="#4b5666" font-size="23">Explain the rule, data,</text><text x="34" y="154" fill="#4b5666" font-size="23">threshold, or decision</text></g>
    <g transform="translate(120 585)"><rect width="350" height="205" rx="24" fill="#fff" stroke="#d99a18" stroke-width="3"/><circle cx="55" cy="55" r="26" fill="#a76800"/><text x="55" y="64" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">3</text><text x="98" y="62" fill="#17243b" font-size="29" font-weight="800">EVIDENCE</text><text x="34" y="120" fill="#4b5666" font-size="23">Point to the source and</text><text x="34" y="154" fill="#4b5666" font-size="23">what it actually supports</text></g>
    <g transform="translate(1130 585)"><rect width="350" height="205" rx="24" fill="#fff" stroke="#da291c" stroke-width="3"/><circle cx="55" cy="55" r="26" fill="#da291c"/><text x="55" y="64" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">4</text><text x="98" y="62" fill="#17243b" font-size="29" font-weight="800">BOUNDARY</text><text x="34" y="120" fill="#4b5666" font-size="23">State what remains unknown</text><text x="34" y="154" fill="#4b5666" font-size="23">or outside this example</text></g>
    <g transform="translate(535 330)"><rect width="530" height="300" rx="38" fill="#1b2a4a" stroke="#da291c" stroke-width="6"/><text x="265" y="72" text-anchor="middle" fill="#f3b5ae" font-size="22" font-weight="800" letter-spacing="4">DEFENSIBLE CLAIM</text><text x="265" y="138" text-anchor="middle" fill="#fff" font-size="38" font-weight="800">Specific enough to test</text><text x="265" y="188" text-anchor="middle" fill="#fff" font-size="38" font-weight="800">Strong enough to explain</text><path d="M116 238h298" stroke="#00aeb3" stroke-width="8" stroke-linecap="round"/><circle cx="116" cy="238" r="13" fill="#00aeb3"/><circle cx="414" cy="238" r="13" fill="#00aeb3"/></g>
  </g>
  <text x="800" y="850" text-anchor="middle" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Precision makes a claim stronger, not smaller</text>
</svg>
