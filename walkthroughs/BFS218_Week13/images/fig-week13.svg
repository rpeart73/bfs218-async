<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">See how your map changed</title>
  <desc id="desc">A red route connects an early observation, later evidence, and a changed interpretation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f5ee"/><stop offset="1" stop-color="#e9eef3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b2a4a" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#da291c"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#9ba8b5" stroke-width="2" opacity=".34">
    <path d="M70 700C280 560 400 790 610 650S1010 520 1260 650 1490 600 1560 510"/>
    <path d="M40 755C260 610 425 845 650 700S1050 575 1285 705 1480 660 1580 575"/>
    <path d="M100 645C300 520 440 720 650 595S1040 470 1245 590 1450 540 1535 455"/>
  </g>
  <text x="92" y="105" fill="#961a13" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">WEEK 13 · EVIDENCE TRAIL</text>
  <text x="92" y="172" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="800">Your final map should reveal movement</text>
  <text x="92" y="220" fill="#4b5666" font-family="Segoe UI,Arial,sans-serif" font-size="26">The point is not that you changed your mind. The point is that you can show why.</text>
  <path d="M290 560C475 415 555 555 755 465S1045 330 1285 425" fill="none" stroke="#da291c" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(110 350)">
      <rect width="360" height="300" rx="24" fill="#fff" stroke="#c9d2dc" stroke-width="3"/>
      <circle cx="58" cy="58" r="29" fill="#1b2a4a"/><text x="58" y="68" text-anchor="middle" fill="#fff" font-size="28" font-weight="900">1</text>
      <text x="105" y="58" fill="#961a13" font-size="20" font-weight="800" letter-spacing="3">WEEK 1 ENTRY</text>
      <text x="38" y="135" fill="#17243b" font-size="34" font-weight="800">What I noticed</text>
      <text x="38" y="185" fill="#4b5666" font-size="24">One tool, one decision,</text><text x="38" y="220" fill="#4b5666" font-size="24">one first question</text>
      <rect x="38" y="254" width="170" height="9" rx="5" fill="#d6dde5"/><rect x="38" y="274" width="245" height="9" rx="5" fill="#d6dde5"/>
    </g>
    <g transform="translate(620 280)">
      <rect width="360" height="300" rx="24" fill="#1b2a4a" stroke="#1b2a4a" stroke-width="3"/>
      <circle cx="58" cy="58" r="29" fill="#da291c"/><text x="58" y="68" text-anchor="middle" fill="#fff" font-size="28" font-weight="900">2</text>
      <text x="105" y="58" fill="#f3b5ae" font-size="20" font-weight="800" letter-spacing="3">LATER EVIDENCE</text>
      <text x="38" y="135" fill="#fff" font-size="34" font-weight="800">What I can prove</text>
      <text x="38" y="185" fill="#e6edf4" font-size="23">A named source, a mechanism,</text><text x="38" y="220" fill="#e6edf4" font-size="23">and an evidence boundary</text>
      <path d="M42 263h50l18-22 27 38 27-19h136" fill="none" stroke="#00aeb3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(1130 210)">
      <rect width="360" height="300" rx="24" fill="#fff" stroke="#da291c" stroke-width="4"/>
      <circle cx="58" cy="58" r="29" fill="#da291c"/><text x="58" y="68" text-anchor="middle" fill="#fff" font-size="28" font-weight="900">3</text>
      <text x="105" y="58" fill="#961a13" font-size="20" font-weight="800" letter-spacing="3">CHANGED VIEW</text>
      <text x="38" y="135" fill="#17243b" font-size="34" font-weight="800">What I see now</text>
      <text x="38" y="185" fill="#4b5666" font-size="24">The same system, explained</text><text x="38" y="220" fill="#4b5666" font-size="24">with greater precision</text>
      <circle cx="76" cy="265" r="24" fill="#e7f3ec" stroke="#1c7a43" stroke-width="5"/><path d="m64 265 9 9 17-21" fill="none" stroke="#1c7a43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="116" y="274" fill="#1c7a43" font-size="22" font-weight="800">TRACE THE CHANGE</text>
    </g>
  </g>
  <rect x="92" y="790" width="1416" height="2" fill="#b8c2cd"/><text x="92" y="838" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Reflection becomes evidence when the route between then and now is visible</text>
</svg>
