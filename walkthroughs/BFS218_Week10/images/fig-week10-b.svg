<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
<title id="title">Who might miss additional support?</title><desc id="desc">A model would direct extra help to students predicted to be at risk. If it overpredicts a student's success, that student may not be flagged and may miss needed help. Bird and colleagues analyse this possible allocation effect; they do not observe support being withdrawn.</desc>
<rect width="680" height="440" fill="white"/><text x="28" y="42" font-size="26" font-weight="700" fill="#15171c">Who might miss additional support?</text><text x="28" y="71" font-size="16" fill="#474c57">Bird and colleagues: a possible effect of biased predictions</text>
<rect x="24" y="160" width="164" height="106" rx="12" fill="#f5f7f9" stroke="#cfd4db"/><text x="106" y="196" text-anchor="middle" font-size="18" font-weight="600">Prediction</text><text x="106" y="220" text-anchor="middle" font-size="15">and risk</text><text x="106" y="242" text-anchor="middle" font-size="15">threshold</text>
<path d="M188 192 L216 143 L239 143 M188 234 L216 299 L239 299" fill="none" stroke="#697386" stroke-width="3"/><path d="M232 138 L240 143 L232 148 M232 294 L240 299 L232 304" fill="none" stroke="#697386" stroke-width="3"/>
<rect x="244" y="99" width="185" height="99" rx="12" fill="#e9f2ee" stroke="#47745b"/><text x="336" y="132" text-anchor="middle" font-size="17" font-weight="600">Predicted at risk</text><text x="336" y="160" text-anchor="middle" font-size="14">Could receive</text><text x="336" y="179" text-anchor="middle" font-size="14">additional support</text>
<rect x="244" y="250" width="185" height="106" rx="12" fill="#fbe9e7" stroke="#b82019"/><text x="336" y="281" text-anchor="middle" font-size="17" font-weight="600">Not flagged</text><text x="336" y="308" text-anchor="middle" font-size="14">Success may be</text><text x="336" y="328" text-anchor="middle" font-size="14">overpredicted</text>
<path d="M432 300 H466 M460 295 L468 300 L460 305" fill="none" stroke="#b82019" stroke-width="3"/>
<rect x="474" y="250" width="181" height="106" rx="12" fill="#fbe9e7" stroke="#b82019"/><text x="564" y="279" text-anchor="middle" font-size="16" font-weight="600" fill="#9a2019">Some students</text><text x="564" y="302" text-anchor="middle" font-size="16" font-weight="600" fill="#9a2019">may miss help</text><text x="564" y="330" text-anchor="middle" font-size="13">despite greater need</text>
<text x="28" y="391" font-size="13" fill="#474c57">The study examines racial differences in model calibration and possible allocation.</text><text x="28" y="413" font-size="13" fill="#474c57">It does not demonstrate observed removal of student support. Bird et al. (2023).</text></svg>
