<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Return to the course question</title><desc id="desc">The course question moves through the student's evidence map and into a future professional field.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f3eb"/><stop offset="1" stop-color="#e3edf2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b2a4a" flood-opacity=".16"/></filter><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#da291c"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="92" y="100" fill="#961a13" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">WEEK 14 · THE RETURN</text><text x="92" y="168" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="800">The question travels with you</text>
  <path d="M420 470H640M960 470h230" stroke="#da291c" stroke-width="12" stroke-linecap="round" marker-end="url(#a)"/>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(90 285)"><rect width="360" height="370" rx="30" fill="#1b2a4a"/><text x="40" y="58" fill="#f3b5ae" font-size="20" font-weight="800" letter-spacing="3">THE COURSE QUESTION</text><text x="40" y="125" fill="#fff" font-size="31" font-weight="800">Will technology</text><text x="40" y="168" fill="#fff" font-size="31" font-weight="800">reproduce inequity</text><text x="40" y="211" fill="#fff" font-size="31" font-weight="800">or help build</text><text x="40" y="254" fill="#fff" font-size="31" font-weight="800">a more just world?</text><path d="M40 310h280" stroke="#00aeb3" stroke-width="8"/></g>
    <g transform="translate(620 235)"><rect width="360" height="470" rx="34" fill="#fff" stroke="#1b2a4a" stroke-width="4"/><text x="180" y="62" text-anchor="middle" fill="#961a13" font-size="21" font-weight="800" letter-spacing="3">YOUR EVIDENCE MAP</text><g transform="translate(180 242)" fill="none" stroke-linecap="round"><circle r="112" stroke="#c8d2dd" stroke-width="22"/><path d="M-88 55C-15-82 30 85 94-52" stroke="#00aeb3" stroke-width="13"/><path d="M-70-50 0 0 78-79" stroke="#da291c" stroke-width="10"/><circle cx="-70" cy="-50" r="18" fill="#fff" stroke="#1b2a4a" stroke-width="6"/><circle r="18" fill="#fff" stroke="#1b2a4a" stroke-width="6"/><circle cx="78" cy="-79" r="18" fill="#fff" stroke="#1b2a4a" stroke-width="6"/></g><text x="180" y="410" text-anchor="middle" fill="#17243b" font-size="25" font-weight="800">Cases · sources · change</text></g>
    <g transform="translate(1170 285)"><rect width="340" height="370" rx="30" fill="#fff" stroke="#da291c" stroke-width="5"/><text x="38" y="58" fill="#961a13" font-size="20" font-weight="800" letter-spacing="3">YOUR FIELD</text><path d="M70 265V130h200v135" fill="none" stroke="#1b2a4a" stroke-width="18"/><path d="M120 265V185h100v80" fill="none" stroke="#00aeb3" stroke-width="14"/><circle cx="170" cy="160" r="22" fill="#ffcc66"/><text x="170" y="320" text-anchor="middle" fill="#17243b" font-size="27" font-weight="800">The next decision</text></g>
  </g><text x="800" y="820" text-anchor="middle" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">The course ends; the responsibility does not</text>
