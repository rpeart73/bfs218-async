<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Use a four-direction compass</title><desc id="desc">A compass points toward evidence, power, impact, and repair.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#fff"/><stop offset="1" stop-color="#e1e8ef"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="100" text-anchor="middle" fill="#961a13" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">AN ACCOUNTABILITY COMPASS</text><text x="800" y="168" text-anchor="middle" fill="#17243b" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="800">Ask in four directions before you act</text>
  <g transform="translate(800 510)" font-family="Segoe UI,Arial,sans-serif"><circle r="260" fill="#1b2a4a" stroke="#fff" stroke-width="18"/><circle r="170" fill="#fff" stroke="#c9d3de" stroke-width="8"/><path d="M0-230 55 0 0 230-55 0Z" fill="#da291c" filter="url(#g)"/><path d="M-230 0 0-55 230 0 0 55Z" fill="#00aeb3" opacity=".88"/><circle r="76" fill="#fff" stroke="#1b2a4a" stroke-width="8"/><text y="-10" text-anchor="middle" fill="#17243b" font-size="24" font-weight="900">BEFORE</text><text y="24" text-anchor="middle" fill="#17243b" font-size="24" font-weight="900">YOU ACT</text>
    <g fill="#fff" font-weight="800"><text x="0" y="-300" text-anchor="middle" font-size="31">EVIDENCE</text><text x="0" y="-266" text-anchor="middle" font-size="19" fill="#dce4ed">What do we know?</text><text x="0" y="317" text-anchor="middle" font-size="31">IMPACT</text><text x="0" y="349" text-anchor="middle" font-size="19" fill="#dce4ed">Who carries the risk?</text><text x="-305" y="-8" text-anchor="middle" font-size="31">POWER</text><text x="-305" y="25" text-anchor="middle" font-size="19" fill="#dce4ed">Who decides?</text><text x="305" y="-8" text-anchor="middle" font-size="31">REPAIR</text><text x="305" y="25" text-anchor="middle" font-size="19" fill="#dce4ed">What must change?</text></g>
  </g>
</svg>
