<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Carry one commitment forward</title><desc id="desc">Evidence, response, and commitment form stepping stones toward a doorway labelled Your field ahead.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17243b"/><stop offset="1" stop-color="#263f50"/></linearGradient><linearGradient id="door" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ffcc66"/><stop offset="1" stop-color="#fff3c6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="100" fill="#f2aaa2" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">CARRY IT FORWARD</text><text x="90" y="168" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="800">A commitment is a practice, not a slogan</text>
  <path d="M0 760C300 650 500 790 760 650S1180 520 1600 610V900H0Z" fill="#102033" opacity=".9"/>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#s)"><g transform="translate(170 590)"><ellipse rx="175" ry="80" fill="#f5f7fa"/><text y="-6" text-anchor="middle" fill="#961a13" font-size="22" font-weight="800" letter-spacing="2">EVIDENCE</text><text y="28" text-anchor="middle" fill="#17243b" font-size="20">Anchor the claim</text></g><g transform="translate(610 500)"><ellipse rx="175" ry="80" fill="#e7f5f5"/><text y="-6" text-anchor="middle" fill="#007d82" font-size="22" font-weight="800" letter-spacing="2">RESPONSE</text><text y="28" text-anchor="middle" fill="#17243b" font-size="20">Fit action to harm</text></g><g transform="translate(1035 410)"><ellipse rx="185" ry="84" fill="#fff2d2"/><text y="-6" text-anchor="middle" fill="#875500" font-size="22" font-weight="800" letter-spacing="2">COMMITMENT</text><text y="28" text-anchor="middle" fill="#17243b" font-size="20">Name what you will do</text></g>
    <g transform="translate(1320 160)"><path d="M0 410V40h240v370" fill="none" stroke="url(#door)" stroke-width="34"/><rect x="55" y="110" width="130" height="300" fill="url(#door)" opacity=".2"/><text x="120" y="0" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">YOUR FIELD, AHEAD</text><circle cx="120" cy="275" r="36" fill="#fff3c6" filter="url(#s)"/></g></g>
  <text x="90" y="830" fill="#d7e0ea" font-family="Segoe UI,Arial,sans-serif" font-size="25">What will you notice, question, or change when you meet the next system?</text>
</svg>
